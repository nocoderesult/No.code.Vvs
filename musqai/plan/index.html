<style>
/* Layout: a production call sheet. One day at a time down a time rail, the week as a strip of seven columns, the quarter as a ledger. */
:root {
  --paper: #f3f5f1; --surface: #ffffff; --surface-2: #e7ece8; --ink: #121614; --ink-2: #3c4741; --muted: #636f68; --line: #d3dad5;
  --accent: #2c6a4d; --accent-ink: #1d4d37; --accent-tint: #dcebe2; --on-accent: #f5fbf7;
  --gold: #8f6d3b; --gold-tint: #f1e7d6;
  --ok: #2b7549; --warn: #93600f; --warn-tint: #f6e8cf;
  --c-prod: #1d5a3f; --c-prod-bg: #dcebe2;
  --c-cont: #7a5a22; --c-cont-bg: #f1e7d6;
  --c-vanz: #1f4f7a; --c-vanz-bg: #dbe7f3;
  --c-tech: #3d4a55; --c-tech-bg: #e2e8ec;
  --c-inv: #6a3f7a; --c-inv-bg: #ebe0f0;
  --c-admin: #4a4f4c; --c-admin-bg: #e6e9e7;
  --c-eu: #8a4a32; --c-eu-bg: #f4e1d8;
  --c-break: #636f68;
  --shadow: 0 1px 2px rgb(18 22 20 / .06), 0 8px 22px rgb(18 22 20 / .06);
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --f-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c100e; --surface: #131916; --surface-2: #19211d; --ink: #e7eee9; --ink-2: #bcc8c1; --muted: #8d9a93; --line: #27312c;
    --accent: #6bc497; --accent-ink: #92dbb4; --accent-tint: #163227; --on-accent: #08130d;
    --gold: #d6b783; --gold-tint: #2b2416; --ok: #6bc497; --warn: #e3a94b; --warn-tint: #2e2312;
    --c-prod: #92dbb4; --c-prod-bg: #163227; --c-cont: #e2c48f; --c-cont-bg: #2b2416; --c-vanz: #9cc4ec; --c-vanz-bg: #172636;
    --c-tech: #b8c4cd; --c-tech-bg: #1e252a; --c-inv: #d3b2e3; --c-inv-bg: #2a1f30; --c-admin: #c3cbc6; --c-admin-bg: #222826;
    --c-eu: #f0b49c; --c-eu-bg: #34211a; --c-break: #8d9a93;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 22px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c100e; --surface: #131916; --surface-2: #19211d; --ink: #e7eee9; --ink-2: #bcc8c1; --muted: #8d9a93; --line: #27312c;
  --accent: #6bc497; --accent-ink: #92dbb4; --accent-tint: #163227; --on-accent: #08130d;
  --gold: #d6b783; --gold-tint: #2b2416; --ok: #6bc497; --warn: #e3a94b; --warn-tint: #2e2312;
  --c-prod: #92dbb4; --c-prod-bg: #163227; --c-cont: #e2c48f; --c-cont-bg: #2b2416; --c-vanz: #9cc4ec; --c-vanz-bg: #172636;
  --c-tech: #b8c4cd; --c-tech-bg: #1e252a; --c-inv: #d3b2e3; --c-inv-bg: #2a1f30; --c-admin: #c3cbc6; --c-admin-bg: #222826;
  --c-eu: #f0b49c; --c-eu-bg: #34211a; --c-break: #8d9a93;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 22px rgb(0 0 0 / .3);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1180px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.tnum { font-variant-numeric: tabular-nums; }

/* Top */
.top { padding-block: 26px 18px; display: grid; gap: 18px; }
.brandline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .06em; }
.title-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
h1.big { font-family: var(--f-display); font-weight: 600; font-size: clamp(36px, 6vw, 64px); line-height: 1; letter-spacing: -.01em; }
h1.big em { font-style: italic; font-weight: 500; color: var(--accent-ink); }
.overall { display: grid; gap: 6px; min-width: 220px; }
.overall b { font-family: var(--f-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }

/* Controls */
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-block: 1px solid var(--line); }
.controls .wrap { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; padding-block: 10px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-right: auto; }
.tabs a { text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
.tabs a:hover { background: var(--surface-2); }
.tabs a.on { background: var(--ink); color: var(--paper); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { padding: 7px 11px; background: var(--surface); border: 0; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ctl select, .ctl input { font: 600 13.5px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13.5px; text-decoration: none; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .5; cursor: default; }

main { padding-block: 24px 64px; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 26px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.hol { background: var(--warn-tint); color: var(--warn); }
.chip.acc { background: var(--accent-tint); color: var(--accent-ink); }
.cat-prod { background: var(--c-prod-bg); color: var(--c-prod); }
.cat-cont { background: var(--c-cont-bg); color: var(--c-cont); }
.cat-vanz { background: var(--c-vanz-bg); color: var(--c-vanz); }
.cat-tech { background: var(--c-tech-bg); color: var(--c-tech); }
.cat-inv { background: var(--c-inv-bg); color: var(--c-inv); }
.cat-admin { background: var(--c-admin-bg); color: var(--c-admin); }
.cat-eu { background: var(--c-eu-bg); color: var(--c-eu); }

/* Day */
.day-head { display: grid; gap: 8px; margin-bottom: 18px; }
.day-head h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; }
.day-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.focus { display: grid; gap: 4px; padding: 16px 18px; border-radius: 12px; background: var(--ink); color: var(--paper); margin-bottom: 18px; }
.focus .eyebrow { color: inherit; opacity: .7; }
.focus b { font-family: var(--f-display); font-size: 24px; font-weight: 600; line-height: 1.2; }
.timeline { list-style: none; display: grid; }
.slot { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; padding-block: 8px; border-top: 1px solid var(--line); }
.slot .time { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); padding-top: 13px; font-variant-numeric: tabular-nums; }
.slot .time small { display: block; color: var(--muted); font-size: 10.5px; }
.blk { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 10px 10px 10px 8px; min-width: 0; }
.blk.done { background: var(--surface-2); }
.blk.done .t { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.check { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; margin-top: 1px; padding: 0; }
.check:hover { border-color: var(--accent); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check[aria-checked="true"]::after { content: "✓"; font-size: 14px; font-weight: 800; }
.check:disabled { cursor: default; }
.t { font-weight: 650; font-size: 15.5px; line-height: 1.35; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.prio { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.prio.p1 { color: var(--accent-ink); font-weight: 600; }
.more { background: none; border: 0; cursor: pointer; color: var(--muted); font-family: var(--f-mono); font-size: 11px; padding: 6px; border-radius: 6px; }
.more:hover { background: var(--surface-2); color: var(--ink); }
.det { grid-column: 2 / -1; display: grid; gap: 8px; padding-top: 6px; font-size: 14.5px; color: var(--ink-2); }
.det ol { padding-left: 18px; display: grid; gap: 4px; }
.det .gata { font-size: 13.5px; }
.det .gata b { color: var(--ok); }
.slot.brk .blk { background: transparent; border-style: dashed; grid-template-columns: minmax(0, 1fr); padding: 7px 12px; color: var(--c-break); font-size: 13.5px; }
.slot.fixed .blk { border-color: var(--accent); }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
.note { width: 100%; min-height: 110px; font: 14.5px/1.5 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.side-list { list-style: none; display: grid; }
.side-list li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; padding-block: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.side-list .check { width: 22px; height: 22px; border-radius: 6px; }
.side-list .check[aria-checked="true"]::after { font-size: 12px; }
.kpi-list { list-style: none; display: grid; gap: 6px; font-size: 14px; }
.kpi-list li::before { content: "→ "; color: var(--accent); }
.gate { padding: 12px 14px; border-radius: 10px; background: var(--warn-tint); color: var(--warn); font-size: 14px; font-weight: 600; }
.ring { display: flex; align-items: center; gap: 10px; }
.ring b { font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }

/* Week */
.week-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; margin-bottom: 16px; }
.week-head h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(28px, 4vw, 42px); line-height: 1.05; }
.days7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.dcard.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dcard h3 { font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
.dcard h3 a { text-decoration: none; }
.dcard .th { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.mini { list-style: none; display: grid; gap: 6px; }
.mini li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; align-items: start; font-size: 12.5px; line-height: 1.35; }
.mini .check { width: 18px; height: 18px; border-radius: 5px; border-width: 1.5px; }
.mini .check[aria-checked="true"]::after { font-size: 10px; }
.mini .tm { font-family: var(--f-mono); font-size: 10px; color: var(--muted); display: block; }
.mini li.done span { color: var(--muted); text-decoration: line-through; }

/* Roadmap */
.ledger { list-style: none; display: grid; }
.ledger li { display: grid; grid-template-columns: 70px 150px minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding-block: 14px; border-top: 1px solid var(--line); }
.ledger .wn { font-family: var(--f-display); font-size: 34px; font-weight: 600; line-height: 1; color: var(--accent); }
.ledger .wt { font-weight: 700; font-size: 16px; }
.ledger .wg { font-size: 13.5px; color: var(--muted); }
.ledger a { text-decoration: none; }
.ledger li.now { background: var(--accent-tint); border-radius: 10px; padding-inline: 12px; }
.w0 { list-style: none; display: grid; }
.w0 li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; padding-block: 9px; border-top: 1px solid var(--line); }
.w0 .check { width: 22px; height: 22px; border-radius: 6px; }

/* Routines */
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.princ { list-style: none; display: grid; }
.princ li { display: grid; gap: 2px; padding-block: 12px; border-top: 1px solid var(--line); }
.princ b { font-size: 16px; }
.princ .src { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-family: var(--f-mono); font-weight: 400; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl-wrap { overflow-x: auto; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 8px; font-size: 14px; z-index: 40; }
.sync { font-size: 12.5px; color: var(--muted); }

@media (max-width: 1020px) {
  .grid-side { grid-template-columns: minmax(0, 1fr); }
  .days7 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ledger li { grid-template-columns: 54px minmax(0, 1fr); }
  .ledger li > :nth-child(2) { grid-column: 2; }
  .ledger li > :nth-child(3) { grid-column: 2; }
  .ledger li > :nth-child(4) { grid-column: 2; }
}
@media (max-width: 640px) {
  .controls { position: static; }
  .title-row, .week-head { grid-template-columns: minmax(0, 1fr); }
  .overall { min-width: 0; }
  .slot { grid-template-columns: 62px minmax(0, 1fr); gap: 8px; }
  .slot .time { font-size: 11px; }
  .days7 { grid-template-columns: minmax(0, 1fr); }
  .cols-2 { grid-template-columns: minmax(0, 1fr); }
  .controls .wrap { gap: 8px 10px; }
  .tabs { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>

  <div class="brandline"><span class="word">MUSQAI</span><span class="eyebrow">Marketing Universe Studio · Quantum AI</span></div>
